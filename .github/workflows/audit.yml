on:
  push:
  pull_request:
      types: [opened, reopened]
  schedule:
    - cron: '00 15 * * 1'

name: Audit

jobs:
  check:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Audit
        run: npm audit --audit-level=low
        shell: bash
